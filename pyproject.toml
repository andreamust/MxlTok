[project]
name = "mxltok"
version = "0.1.0"
description = "MusicXML tokenizer for symbolic music"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=0.24",
    "numpy>=1.26",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mxltok"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
    "ty>=0.0.1a",
]
music21 = ["music21>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "SIM", "RUF", "PTH"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]

[tool.ty.src]
include = ["src"]
